<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程评论情感分析工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 26px;
            color: #333;
            margin-bottom: 6px;
        }

        .header .subtitle {
            font-size: 13px;
            color: #999;
        }

        .input-section textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
            outline: none;
        }

        .input-section textarea:focus {
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin: 20px 0 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-analyze:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            background: #f5f5f5;
            color: #666;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        /* 分数圆环 */
        .score-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .score-circle {
            display: inline-block;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #f5f5f5;
            transition: all 0.5s;
            position: relative;
        }

        .score-circle .score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            color: #666;
        }

        /* 进度条 */
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #999;
            border-radius: 5px;
            transition: all 0.5s;
        }

        /* 结果区 */
        .result-section {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item .label {
            color: #888;
        }

        .result-item .value {
            font-weight: bold;
            font-size: 16px;
        }

        .interpretation {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #888;
            line-height: 1.8;
        }

        .error-msg {
            color: #F44336;
            text-align: center;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📊 课程评论情感分析</h1>
            <p class="subtitle">基于 SnowNLP · 中文情感分析引擎</p>
        </div>

        <!-- 输入区 -->
        <div class="input-section">
            <textarea id="reviewInput" placeholder="请输入课程评论，例如：老师讲得特别好，条理清晰，收获很多..."></textarea>
        </div>

        <!-- 错误提示 -->
        <p class="error-msg" id="errorMsg"></p>

        <!-- 按钮 -->
        <div class="btn-group">
            <button class="btn btn-analyze" id="analyzeBtn" onclick="analyzeReview()">🔍 分析情感</button>
            <button class="btn btn-clear" onclick="clearAll()">🗑️ 清空</button>
        </div>

        <!-- 分数圆环 -->
        <div class="score-display">
            <div class="score-circle" id="scoreCircle">
                <span class="score-value" id="scoreValue">-</span>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- 结果区 -->
        <div class="result-section" id="resultSection">
            <div class="result-item">
                <span class="label">情感标签</span>
                <span class="value" id="resultLabel">-</span>
            </div>
            <div class="result-item">
                <span class="label">情感分数</span>
                <span class="value" id="resultScore">-</span>
            </div>
            <div class="result-item">
                <span class="label">置信度</span>
                <span class="value" id="resultConfidence">-</span>
            </div>
            <div class="interpretation">
                💡 <strong>解读：</strong><br>
                · 分数 &gt; 0.6 为正面评价<br>
                · 分数 &lt; 0.4 为负面评价<br>
                · 分数在 0.4~0.6 之间为中性评价<br>
                · 置信度越接近 100%，模型越确定
            </div>
        </div>
    </div>

    <script>
        async function analyzeReview() {
            const text = document.getElementById('reviewInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('analyzeBtn');

            // 隐藏之前的错误
            errorMsg.style.display = 'none';

            if (text.length < 4) {
                errorMsg.textContent = '⚠️ 评论太短，至少输入4个字';
                errorMsg.style.display = 'block';
                return;
            }

            // 按钮禁用，显示加载
            btn.disabled = true;
            btn.textContent = '⏳ 分析中...';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    const err = await response.json();
                    errorMsg.textContent = '⚠️ ' + err.error;
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '🔍 分析情感';
                    return;
                }

                const result = await response.json();

                // 更新分数圆环
                const scoreCircle = document.getElementById('scoreCircle');
                const scoreValue = document.getElementById('scoreValue');
                scoreCircle.style.background = result.color + '20';
                scoreCircle.style.border = '4px solid ' + result.color;
                scoreValue.textContent = result.score.toFixed(2);
                scoreValue.style.color = result.color;

                // 更新进度条
                const progressBar = document.getElementById('progressBar');
                progressBar.style.width = (result.score * 100) + '%';
                progressBar.style.background = result.color;

                // 更新结果
                document.getElementById('resultLabel').textContent = result.label;
                document.getElementById('resultLabel').style.color = result.color;
                document.getElementById('resultScore').textContent = result.score.toFixed(4);
                document.getElementById('resultConfidence').textContent = (result.confidence * 100).toFixed(1) + '%';

                document.getElementById('resultSection').classList.add('show');

            } catch (err) {
                errorMsg.textContent = '⚠️ 网络错误，请检查服务是否启动';
                errorMsg.style.display = 'block';
            }

            btn.disabled = false;
            btn.textContent = '🔍 分析情感';
        }

        function clearAll() {
            document.getElementById('reviewInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';

            const scoreCircle = document.getElementById('scoreCircle');
            scoreCircle.style.background = '#f5f5f5';
            scoreCircle.style.border = 'none';
            document.getElementById('scoreValue').textContent = '-';
            document.getElementById('scoreValue').style.color = '#666';

            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressBar').style.background = '#999';

            document.getElementById('resultSection').classList.remove('show');
        }

        // 支持 Ctrl+Enter 快捷键分析
        document.getElementById('reviewInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeReview();
            }
        });
    </script>
</body>
</html>
